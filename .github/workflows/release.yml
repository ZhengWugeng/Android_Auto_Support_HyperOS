name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build release ZIP
        run: python tools/build_release.py
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-auto-support-hyperos
          path: |
            release/*.zip
            release/SHA256SUMS.txt
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt --title "Android Auto Support HyperOS $GITHUB_REF_NAME" --generate-notes
